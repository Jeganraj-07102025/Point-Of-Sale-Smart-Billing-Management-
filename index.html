<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Point Of Sale Billing System</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- INPUT SECTION -->
    <div class="box">
      <h2>Bill Generator</h2>

      <label>Product ID</label>
      <input type="text" id="pid" oninput="fetchProduct()" />

      <label>Product Name</label>
      <input type="text" id="pname" disabled />

      <label>Price</label>
      <input type="text" id="price" disabled />

      <label>Quantity</label>
      <input type="number" id="qty" />

      <label>Grand Total</label>
      <input type="text" id="total" disabled />

      <button class="add-btn" onclick="addItem()">Add Item</button>
      <button class="print-btn" onclick="window.print()">Print Bill</button>
    </div>

    <!-- BILL SECTION -->
    <div id="billBox">
      <h2 id="billh">Hari Super Stores Private Limited</h2>

      <div class="bill-info">
        <p><strong>Bill No:</strong> <span id="billNo"></span></p>
        <p><strong>Date & Time:</strong> <span id="dateTime"></span></p>
      </div>

      <table>
        <thead>
          <tr>
            <th>Product ID</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
          </tr>
        </thead>

        <tbody id="billBody"></tbody>
      </table>

      <div id="grandTotal">Grand Total : 0</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
